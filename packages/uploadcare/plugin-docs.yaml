displayName: Uploadcare
description: File uploading, storage, processing, and delivery for web and mobile apps.
recommendedAuth: api_key
overviewNote: |
  REST calls use `Uploadcare.Simple public_key:secret_key` against `https://api.uploadcare.com/`
  with `Accept: application/vnd.uploadcare-v0.7+json`. Upload API calls use the public key only.
examples:
  read:
    path: files.list
    args:
      limit: 10
      stored: true
    title: List stored files
  write:
    path: files.store
    args:
      uuid: 22240276-2f06-41f8-9411-755c8ce926ed
    title: Store a file
